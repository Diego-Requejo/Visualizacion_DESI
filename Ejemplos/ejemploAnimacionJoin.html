<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01">
<html lang="es" style=" width: 100%; height: 100%;">
<head>
    <meta charset="UTF-8">
    <title>Drawing a Bar Chart</title>
    <script type="text/javascript" src="https://d3js.org/d3.v7.min.js"></script>
</head>
<style>
    body {
        height: 100%;
        font: 14px sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .axis path,
    .axis line {
        fill: none;
        stroke: #000;
        shape-rendering: crispEdges;
    }
    .grid .tick line{
        stroke: lightgrey;
        opacity: 0.7;
    }
    .grid path {
        stroke-width: 0;
    }
    .axis {
        font: 14px sans-serif;
    }
    .x.axis path {
        display: none;
    }
    .title{
        font-weight: bold;
    }


</style>
<body>

<script type="text/javascript">
    var margin = {top: 70, right: 20, bottom: 30, left: 40},
        w = 500 - margin.left - margin.right,
        h = 350 - margin.top - margin.bottom;
    var color = d3.scaleOrdinal(d3.schemeCategory10);
    var x = d3.scaleBand().rangeRound([0,w]).padding(.1);
    var y = d3.scaleLinear()
        .range([h, 0]);
    var formatPercent = d3.format(".0%");
    var xAxis = d3.axisBottom(x);
    var yAxis = d3.axisLeft(y).ticks(5)
        .tickFormat(formatPercent);
    var yGrid = d3.axisLeft(y)
        .ticks(5)
        .tickSize(-w, 0, 0)
        .tickFormat("")
    var svg = d3.select("body").append("svg")
        .attr("width", w + margin.left + margin.right)
        .attr("height", h + margin.top + margin.bottom)
        .append("g")
        .attr("transform", "translate(" + margin.left + ", " + margin.top + ")");
    var globalData;
    var sum;
    var hidden = false;
    var hola = [];
    d3.csv("data_04.csv").then(function (data){
        globalData = data;
        sum = 0;
        data.forEach(function(d) {
            d.income = +d.income;
            sum += d.income;
        });
        console.log(hola);
        x.domain(data.map(function(d) { return d.country; }));
        y.domain([0, d3.max(data, function(d) { return d.income/sum; })]);
        svg.append("g")
            .attr("class", "x axis")
            .attr("transform", "translate(0, " + h + ")")
            .call(xAxis);
        svg.append("g")
            .attr("class", "y axis")
            .call(yAxis);
        svg.append("g")
            .attr("class", "grid")
            .call(yGrid);
        var labels = svg.append("g")
            .attr("class", "labels");
        labels.append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", 6)
            .attr("dy", ".71em")
            .style("text-anchor", "end")
            .text("Income [%]");
        var title = svg.append("g")
            .attr("class", "title");
        title.append("text")
            .attr("x", (w / 2))
            .attr("y", -30 )
            .attr("text-anchor", "middle")
            .style("font-size", "35px")
            .text("My first bar chart");
        svg.selectAll(".bar")
            .data(data)
            .enter().append("rect")
            .attr("class", "bar")
            .attr("x", function(d) { return x(d.country); })
            .attr("width", x.bandwidth())
            .attr("y", h)
            .attr("height", 0)
            .attr("fill", "grey")
            .on("mouseover", handleMouseOver)
            .on("mouseout", handleMouseOut)
            .on("click", handleMouseClick)
            .transition().delay(100).duration(3000).attr("y", function(d) { return y(d.income/sum); }).attr("height", function(d) { return h - y(d.income/sum); })





    });

    // Create Event Handlers for mouse
    function handleMouseOver(event, i) {  // Add interactivity

        // Use D3 to select element, change color and size
        d3.select(this)
            .attr("fill","red")
        // Specify where to put label of text
        svg.append("text")
            .attr("id","t" + i.country.replace(" ","_")) // Create an id for text so we can select it later for removing on mouseout
            .attr("x", x(i.country)+28)
            .attr("y", 230)
            .style("font-size", "20px")
            .style("font-weight", "bold")
            .text(i.income); // Value of the text

    }

    function handleMouseOut(event, i) {
        // Use D3 to select element, change color back to normal
        d3.select(this)
            .attr("fill","grey")

        // Select text by id and then remove
        d3.select("#t" + i.country.replace(" ","_")).remove();  // Remove text location
    }

    function handleMouseClick(event, d) {
        if (!hidden) {
            // Ocultar todas las barras excepto la seleccionada
            svg.selectAll(".bar")
                .transition()
                .duration(2000)
                .attr("height", function(barData) {
                    // Mantener altura solo de la barra clicada
                    if (barData.country === d.country) {return h - y(barData.income / sum);}
                    else {return 0;}
                })
                .attr("y", function(barData) {
                    // Mantener altura solo de la barra clicada
                    if (barData.country === d.country) return y(d.income/sum);
                    else return h;
                });
            hidden = true;
        } else {
            // Mostrar todas las barras
            svg.selectAll(".bar")
                .transition()
                .duration(2000)
                .attr("height", function(barData) {
                    return h - y(barData.income / sum);
                })
                .attr("y", function(barData) {
                    return y(barData.income/sum);
                });
            hidden = false;
        }
    }

</script>

</body>
</html>
