<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01">
<html>
<head>
  <meta charset="utf-8">
  <script src="https://d3js.org/d3.v6.min.js" charset="utf-8"></script>
  <script type="text/javascript" src="js/MapaCyL_V6.js"></script>
  <link rel="stylesheet" type="text/css" href="ejHtmlTema4_Mapas_V4d3_CyL.css">
  <title>Pruebas D3: Mapas - D3 V5</title>

  <script  type="text/javascript">
    document.addEventListener("DOMContentLoaded", function(e) {  // La función se ejecute cuando el documento este listo
    d3.select("#grafico").selectAll("svg").remove();  // Por si acaso, borramos el elemento svg que esta en la etiqueta div con identificador "myChart"
    dibuja_CYL(0);  // Pintamos el mapa en version basica
    var selec = d3.selectAll("input[type=radio][name=dataSeries]"); // Seleccionamos todos los elementos que contengan lo entrecomillado
    selec.attr("checked", false); // Ponemos todos los elementos del radio buttom a false
    selec.each(function(d,i) { // para poner "checked" el elemento input con valor=0
      //console.log(this);
      if (this.value == 0) {
        this["checked"] = true; // cambiamos ese elemento del objeto. En este caso para que "All" este seleccionado
        // Tambien se podría haber puesto this.value = true
      }
    });
// CAMBIADO PARA LA V6
    selec.on("change", function(event) {   // Se le llama al cambiar cualquier elemento input de la seleccion
      console.log(event.target.value);
      d3.select("#grafico").selectAll("svg").remove();
      dibuja_CYL(event.target.value);
    });
  });
  </script>
</head>

<body>
  <h1> Mapa de Castilla y Leon</h1>
  <div id="grafico">
  </div>

  <div id="radio">
    <table>
      <tr>
        <td>
          <input name="dataSeries" value="0" type="radio" checked />Básico</li>
          <input name="dataSeries" value="1" type="radio" />Aumentando y centrando</li>
          <input name="dataSeries" value="2" type="radio" />Accediendo a cada provincia</li>
          <input name="dataSeries" value="3" type="radio" />Dando color a cada provincia</li>
        </td>
      </tr>
    </table>
  </div>

</body>
</html>
