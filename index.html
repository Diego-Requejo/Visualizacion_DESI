      <!DOCTYPE HTML>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="text/javascript" src="js/datos.js"></script>
  <script type="text/javascript" src="js/controlEventos.js"></script>
  <script type="text/javascript" src="js/dibujar.js"></script>


  <title>Proyecto Visualización</title>

</head>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background-color: #AAF0D1;
  }

  h1{
    font-size:250%;
    text-align:center;
    font-weight: bold;
    margin: 5px 0;
  }

  .contenedor{
    width: 100%;
    height: 100%;
    padding: 10px;
    justify-content: center;
  }

  #contenedorMapa {
    display: flex;
  }

  #contenedorBarras{
    display: none;
    position: relative;
  }

  #coropletico {
    height:90%;
    aspect-ratio: 1/1;
    margin: 0 10px 0 5px;
  }



  #checkboxesDiv{
    height: 80%;
    width: auto;
    display: flex;
    align-items: center;

  }

  fieldset{
    border: 2px solid #aaa;
    border-radius: 10px;
  }

  #leyenda{
    border:1px solid #aaa;
    height: 180px;
    width: 150px;
    text-align: center;
    border-radius: 10px;
  }

  legend{
    font-size: 20pt;
    font-weight: bold;
  }

  input[type="checkbox"]{
    margin-bottom: 2px;
    width: 12px;
    height: 12px;
    cursor: pointer;
  }

  label{
    font-size: 11pt;
    cursor: pointer;
  }

  #barrasDiv{
    height:80%;
    aspect-ratio: 3/2;
    margin: 10px 0 0 10px;
    justify-self: center;
  }

  #barSvg{
    height: 100%;
    width: 100%;
  }

  #btnVolverMapa{
      position: absolute; /* Sacar del flujo normal */
      left: 5%; /* Pegado a la izquierda */
      top: 0px; /* Separación desde arriba */
      height: 50px;
      width: auto;
      padding: 5px 10px;
      float: left;
      font-size: 18pt;
      font-weight: bold;
      color: white;
      background-color: blue;
      border-radius: 20px;
      cursor: pointer;
  }
</style>

<body onload="inicializar()">

<h1>Distribución de comercios por <br> sectores en las provincias de CyL </h1>

<!-- Contenedor mapa y checkbox-->
<div id="contenedorMapa" class="contenedor">

  <!-- Leyenda -->
  <div id="leyenda">
    <h3 style="margin: 3px">Comercios /<br>
    10.000 hab</h3>
    <svg id="leyendaSvg" width="100%" height="120">
      <rect x="10"  y="98" width="20" height="20" fill="#ffbfaa"></rect> <text id = "interBajo" x="40" y="110">Bajo</text>
      <rect x="10"  y="70" width="20" height="20" fill="#ff7b5a"></rect> <text id = "interMedio" x="40" y="85">Medio</text>
      <rect x="10"  y="40" width="20" height="20" fill="#ff0000"></rect> <text id = "interMedioalto" x="40" y="55">Medioalto</text>
      <rect x="10"  y="10" width="20" height="20" fill="#a51b0b"></rect> <text id = "interAlto" x="40" y="25">Alto</text>
    </svg>
  </div>

  <!-- Mapa -->
  <div id="coropletico">

  </div>


    <!-- Checkbox -->
    <div id="checkboxesDiv">
      <fieldset>
      <legend>Sectores</legend>
      <label><input type="checkbox" id="selTodo" onchange="selecTodo()" checked>Seleccionar todo</label><br>
      <label><input type="checkbox" id="deselTodo" onchange="deselecTodo()">Deseleccionar todo</label>
      <hr>
      <label><input type="checkbox" name="sector" oninput="cambioFiltros(0, checked)">Supermercados y alimentación</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(1, checked)">Prendas de vestir y textiles</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(2, checked)">Farmacias y ópticas</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(3, checked)">Carnicerías</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(4, checked)">Bazares y otros establecimientos</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(5, checked)">Bricolaje</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(6, checked)">Fruterías</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(7, checked)">Venta y repuestos vehículos</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(8, checked)">Muebles</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(9, checked)">Panaderías y confiterías</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(10, checked)">Combustibles</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(11, checked)">Tabaco / estanco</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(12, checked)">Librerías y juguetes</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(13, checked)">Plantas y animales de compañía</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(14, checked)">Electrodomésticos</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(15, checked)">Productos cosméticos e higiénicos</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(16, checked)">Informática y telecomunicaciones</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(17, checked)">Otros-artículos nuevos</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(18, checked)">Calzado y cuero</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(19, checked)">Pescaderías</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(20, checked)">Relojería y joyería</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(21, checked)">Artículos Deportivos</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(22, checked)">Kioskos y papelería</label><br>
      <label><input type="checkbox" name="sector" onchange="cambioFiltros(23, checked)">Segunda mano</label><br>
      </fieldset>
    </div>
</div>

<!--GraficoBarras-->
<div id="contenedorBarras" class="contenedor">
  <button id="btnVolverMapa" onclick="botonVolver()">Volver al mapa</button>

  <div id="barrasDiv">
    <svg id="barSvg">
      <!-- Se vacía y llena con D3 al clicar provincia -->
    </svg>
  </div>



</div>

</body>
</html>
